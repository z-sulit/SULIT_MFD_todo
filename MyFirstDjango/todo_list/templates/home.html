{% extends 'base.html' %}
{% block content %}
    {% if all_items %}
    <table class="table">
            {% for things in all_items %}
                <tr>
                {% if things.completed%}
                    <td><s>{{ things.item }}</s></td>
                    <td><center><a href="{% url 'unstrike' things.id %}" class="btn btn-warning btn-sm">Unstrike</a></center></td>
                {% else %}
                    <td>{{ things.item }}</td>
                    <td><center><a href="{% url 'strike' things.id %}" class="btn btn-success btn-sm">Strike</a></center></td>
                {% endif %}
                    <td><center><a href="{% url 'delete' things.id %}" class="btn btn-danger btn-sm">Delete</a></center></td>
                </tr>
            {% endfor %}
    </table>
    {% endif %}
    <h1>strelitzia! Homepage</h1>
{% endblock %}
